[package]
name = "furtherance"
version = "1.9.1"
authors = ["Ricky Kresslein <ricky@unobserved.io>"]
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["unstable-locales"] }
csv = "1.4"
dbus = "0.9.12"
directories = "6.0"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk4-macros = "0.11.5"
itertools = "0.15"
log = "0.4"
num-derive = "0.5.1"
num-traits = "0.2.19"
once_cell = "1.21.4"
rusqlite = { version = "0.43.0", features = ["backup"] }
serde = { version = "1.0", features = ["derive"] }

[dependencies.gtk]
package = "gtk4"
version = "0.11.5"

[dependencies.adw]
package = "libadwaita"
version = "0.9.2"
features = ["v1_2"]
